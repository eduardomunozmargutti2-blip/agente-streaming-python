<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PoC OpenAI Streaming</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 750px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
        textarea { width: 100%; height: 90px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { margin-top: 10px; padding: 10px 20px; font-size: 15px; background-color: #10a37f; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background-color: #0d8a6c; }
        button:disabled { background-color: #9dc9bd; cursor: not-allowed; }
        #output { margin-top: 20px; padding: 16px; background: #f7f7f8; border: 1px solid #e5e5e5; border-radius: 6px; white-space: pre-wrap; min-height: 120px; font-size: 15px; }
    </style>
</head>
<body>
    <h2>PoC: Streaming de IA via REST (OpenAI + FastAPI)</h2>
    <textarea id="prompt" placeholder="Digite sua pergunta...">Explique o funcionamento de streaming HTTP em 3 tópicos sucintos.</textarea>
    <br>
    <button id="enviar">Enviar Requisição</button>

    <h3>Resposta em Tempo Real:</h3>
    <div id="output"></div>

    <script>
        const botao = document.getElementById('enviar');
        const outputDiv = document.getElementById('output');

        async function enviarPergunta() {
            const prompt = document.getElementById('prompt').value;
            botao.disabled = true;
            outputDiv.innerText = "Aguardando resposta do servidor...";

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    outputDiv.innerText = "Erro: " + (JSON.stringify(errData.detail) || response.statusText);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                outputDiv.innerText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    outputDiv.innerText += decoder.decode(value, { stream: true });
                }
            } catch (err) {
                outputDiv.innerText = "Erro na requisição: " + err.message;
            } finally {
                botao.disabled = false;
            }
        }

        botao.addEventListener('click', enviarPergunta);
    </script>
</body>
</html>
